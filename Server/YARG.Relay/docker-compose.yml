# Caddy serves the WebGL build and proxies /ws to the relay, on one origin with automatic HTTPS.
# YARG_DOMAIN: the VPS's domain (its DNS A/AAAA records must point at the VPS).
# YARG_WEB_BUILD: folder with the WebGL build (index.html, Build/, StreamingAssets/).
services:
  relay:
    build: .
    restart: unless-stopped
    environment:
      # Caddy replaces X-Forwarded-For with the real client IP, so the per-IP limits see the player
      Relay__TrustForwardedFor: "true"
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - relay
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      YARG_DOMAIN: ${YARG_DOMAIN:?set YARG_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${YARG_WEB_BUILD:-./web}:/srv/yarg:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
